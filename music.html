<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="music.html">
      <span class="brand-mark">🎧</span>
      <span>一起听</span>
    </a>
    <button class="btn btn-soft btn-sm" id="refresh" type="button">
      <svg class="icon-refresh" viewBox="0 0 24 24" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/>
        <path d="M20.5 4.6V10H15"/>
      </svg>
      <span>刷新</span>
    </button>
    <button class="header-signout" type="button" hidden>退出登录</button>
    <a class="header-login" href="login.html" aria-label="登录或注册">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8.2" r="3.6"/>
        <path d="M5.2 19.4a6.9 6.9 0 0 1 13.6 0"/>
      </svg>
      <span class="header-login-text">登录 / 注册</span>
    </a>
    <a class="header-bell" id="header-bell" href="notifications.html" aria-label="提醒">
      <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8.5a6 6 0 1 0-12 0c0 6.5-2.5 8-2.5 8h17S18 15 18 8.5"/>
        <path d="M13.6 20.5a2 2 0 0 1-3.2 0"/>
      </svg>
      <span class="header-bell-badge" id="header-badge" hidden></span>
    </a>
  </div>
</header>

<main class="wrap" id="main" tabindex="-1">

  <div class="notice notice-info" id="notice" role="status" aria-live="polite" aria-atomic="true" hidden></div>

  <!-- 发歌：只有登录的公开账号能看到这个表单 -->
  <section class="music-publish" id="publish-card" hidden>
    <p class="text-sm on-gold">发一首歌</p>
    <div class="music-publish-row">
      <label style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)" for="music-url">歌曲或视频链接</label>
      <input class="input" id="music-url" type="url" inputmode="url" autocomplete="off"
             placeholder="粘贴网易云 / QQ 音乐 / B 站 的歌曲或视频链接">
      <label style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)" for="music-note">一句话</label>
      <input class="input" id="music-note" type="text" maxlength="200" autocomplete="off"
             placeholder="一句话：为什么想听这首…（200 字以内）">
      <button class="btn btn-primary" id="music-send" type="button">发布</button>
    </div>
    <p class="hint">只支持网易云 / QQ 音乐 / B 站。匿名身份发不了歌，登录公开账号后就能发。</p>
  </section>

  <!-- 别人邀我一起听 -->
  <section class="music-section" id="invites-card" hidden>
    <div class="row-between" style="padding:18px 0 10px">
      <p class="text-sm on-gold">一起听邀约</p>
    </div>
    <div id="invites"></div>
  </section>

  <!-- 音乐专区 -->
  <section class="music-section" id="feed-card">
    <div class="row-between" style="padding:18px 0 10px">
      <p class="text-sm on-gold">音乐专区</p>
      <span class="hint" id="feed-count"></span>
    </div>
    <div id="music-feed"></div>
    <p class="hint" id="feed-empty" hidden>还没有人发歌。第一个发一首吧。</p>
    <p class="hint" id="feed-loading">正在读取…</p>
  </section>

</main>
